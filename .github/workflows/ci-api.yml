name: ci-api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/ci-api.yml"]
  pull_request:
    paths: ["apps/api/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/ci-api.yml"]

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repo structure
        run: pnpm check:structure
      - name: Typecheck
        run: pnpm --filter @jobrio/api typecheck
      - name: Unit tests
        run: pnpm --filter @jobrio/api test
