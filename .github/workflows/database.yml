name: database

on:
  push:
    branches: [main]
    paths:
      [
        "packages/database/**",
        "infrastructure/database/**",
        "infrastructure/seed/**",
        ".github/workflows/database.yml",
      ]
  pull_request:
    paths:
      [
        "packages/database/**",
        "infrastructure/database/**",
        "infrastructure/seed/**",
        ".github/workflows/database.yml",
      ]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck database helpers
        run: pnpm turbo run typecheck --filter=@wealthspan/database --filter=@wealthspan/api
