name: deploy-production

# Deploys the Catalyst functions and client (apps/api/catalyst) with the Catalyst CLI.
# Runs only manually. Requires repository secrets: CATALYST_TOKEN, CATALYST_PROJECT_ID.
# After every deploy, re-set SARVAM_API_KEY in the Catalyst console (a deploy wipes variables
# that are not in catalyst-config.json).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test before deploy
        run: pnpm test
      - name: Build the web and admin clients
        run: pnpm build:client
      - name: Install Catalyst CLI
        run: npm i -g zcatalyst-cli
      - name: Deploy
        working-directory: apps/api/catalyst
        run: catalyst deploy --project ${{ secrets.CATALYST_PROJECT_ID }} --dc in --token ${{ secrets.CATALYST_TOKEN }}
