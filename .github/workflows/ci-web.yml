name: ci-web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/ci-web.yml"]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repo structure
        run: pnpm check:structure
      - name: Typecheck
        run: pnpm --filter @wealthspan/web typecheck
      - name: Build
        run: pnpm --filter @wealthspan/web build
