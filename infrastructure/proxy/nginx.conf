# Wealthspan edge proxy — routes one public origin to two deployable apps.
#
#   /admin/*  → apps/admin   (admin console)
#   /*        → apps/web (Wealthspan user app)
#
# Self-hosted alternative to the root `vercel.json` rewrites. Both must stay
# in sync: the admin app is served under the /admin prefix.

upstream wealthspan_platform {
    server 127.0.0.1:3000;
}

upstream wealthspan_admin {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name _;

    # Security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # Admin console — never cached, never indexed.
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass         http://wealthspan_admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 301 /admin/dashboard/admin;
    }

    # Everything else — the platform app.
    location / {
        proxy_pass         http://wealthspan_platform;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
